name: Capture Rust CI Diagnostics

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ci-diagnostics.yml

permissions:
  contents: write

concurrency:
  group: capture-rust-ci-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Capture rustfmt output
        id: fmt
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check 2>&1 | Tee-Object -FilePath fmt.log
          $code = $LASTEXITCODE
          "exit_code=$code" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Capture Clippy output
        id: clippy
        shell: pwsh
        run: |
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings 2>&1 | Tee-Object -FilePath clippy.log
          $code = $LASTEXITCODE
          "exit_code=$code" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Write diagnostic evidence
        shell: pwsh
        run: |
          $fmt = (Get-Content fmt.log -Tail 300) -join "`n"
          $clippy = (Get-Content clippy.log -Tail 300) -join "`n"
          $timestamp = (Get-Date).ToUniversalTime().ToString("o")
          $report = @"
          # Rust CI Diagnostics

          Machine-generated on a clean GitHub-hosted `windows-latest` runner.

          - Source commit: $env:GITHUB_SHA
          - Recorded at (UTC): $timestamp
          - rustfmt exit code: ${{ steps.fmt.outputs.exit_code }}
          - Clippy exit code: ${{ steps.clippy.outputs.exit_code }}

          ## rustfmt

          ````text
          $fmt
          ````

          ## Clippy

          ````text
          $clippy
          ````
          "@
          Set-Content -Path docs/CI_DIAGNOSTICS.md -Value $report -Encoding utf8

      - name: Commit diagnostics
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CI_DIAGNOSTICS.md
          git commit -m "ci: capture Rust diagnostics"
          git push origin HEAD:main

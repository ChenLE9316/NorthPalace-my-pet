name: Bootstrap Dependency Locks

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-lockfiles.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-dependency-locks
  cancel-in-progress: false

jobs:
  lockfiles:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify npm lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Resolve Cargo lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Verify Cargo lockfile
        shell: pwsh
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 | Out-Null

      - name: Commit verified locks and remove bootstrap workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock
          git rm .github/workflows/bootstrap-lockfiles.yml
          git commit -m "build: commit clean-runner dependency locks"
          git push origin HEAD:main

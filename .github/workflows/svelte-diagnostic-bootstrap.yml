name: Bootstrap Svelte Diagnostics

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/svelte-diagnostic-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-svelte-diagnostics
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve diagnostic toolchain
        id: resolve
        continue-on-error: true
        shell: pwsh
        run: |
          npm install --save-dev --save-exact typescript@6.0.3 "@typescript/native@npm:typescript@7.0.2" svelte-check@4.7.4 2>&1 | Tee-Object resolve.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm pkg set "scripts.check:svelte=svelte-check --config ./vite.config.ts --tsconfig ./tsconfig.json"
          npm pkg set "scripts.check:svelte:tsgo=svelte-check --tsgo --config ./vite.config.ts --tsconfig ./tsconfig.json"

      - name: Verify clean install from generated lock
        id: npm_ci
        if: steps.resolve.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund 2>&1 | Tee-Object npm-ci.log
          exit $LASTEXITCODE

      - name: Run Svelte TS6 diagnostics
        id: ts6
        if: steps.npm_ci.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          npm run check:svelte 2>&1 | Tee-Object svelte-ts6.log
          exit $LASTEXITCODE

      - name: Run Svelte TS7 tsgo diagnostics
        id: ts7
        if: steps.npm_ci.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          npm run check:svelte:tsgo 2>&1 | Tee-Object svelte-ts7.log
          exit $LASTEXITCODE

      - name: Build frontend
        id: build
        if: steps.npm_ci.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          npm run build 2>&1 | Tee-Object build.log
          exit $LASTEXITCODE

      - name: Validate tracked data
        id: tracked
        if: steps.npm_ci.outcome == 'success'
        continue-on-error: true
        run: npm run validate:repo

      - name: Publish diagnostic result
        if: always()
        shell: pwsh
        run: |
          $ok = (
            "${{ steps.resolve.outcome }}" -eq "success" -and
            "${{ steps.npm_ci.outcome }}" -eq "success" -and
            "${{ steps.ts6.outcome }}" -eq "success" -and
            "${{ steps.ts7.outcome }}" -eq "success" -and
            "${{ steps.build.outcome }}" -eq "success" -and
            "${{ steps.tracked.outcome }}" -eq "success"
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ($ok) {
            $timestamp = (Get-Date).ToUniversalTime().ToString("o")
            $report = @(
              "# Svelte Diagnostic Baseline",
              "",
              "Machine-generated on a clean GitHub-hosted windows-latest runner.",
              "",
              "- Validated working-tree parent: $env:GITHUB_SHA",
              "- Recorded at (UTC): $timestamp",
              "- Node.js: $((node --version | Out-String).Trim())",
              "- npm: $((npm --version | Out-String).Trim())",
              "- TypeScript language service: 6.0.3",
              "- TypeScript tsgo alias: 7.0.2",
              "- svelte-check: 4.7.4",
              "",
              "| Check | Outcome |",
              "|---|---|",
              "| npm ci from generated package-lock.json | success |",
              "| svelte-check / TypeScript 6 | success |",
              "| svelte-check --tsgo / TypeScript 7 | success |",
              "| Vite production build | success |",
              "| tracked local/private data guard | success |"
            )
            $report | Set-Content docs/SVELTE_DIAGNOSTIC_BASELINE.md -Encoding utf8
            if (Test-Path docs/SVELTE_DIAGNOSTICS.md) { git rm docs/SVELTE_DIAGNOSTICS.md }
            git add package.json package-lock.json docs/SVELTE_DIAGNOSTIC_BASELINE.md
            git commit -m "build: lock Svelte TS6 and TS7 diagnostics"
            git push origin HEAD:main
            exit 0
          }

          $resolve = if (Test-Path resolve.log) { (Get-Content resolve.log -Tail 120) -join "`n" } else { "not run" }
          $ts6 = if (Test-Path svelte-ts6.log) { (Get-Content svelte-ts6.log -Tail 220) -join "`n" } else { "not run" }
          $ts7 = if (Test-Path svelte-ts7.log) { (Get-Content svelte-ts7.log -Tail 220) -join "`n" } else { "not run" }
          $build = if (Test-Path build.log) { (Get-Content build.log -Tail 120) -join "`n" } else { "not run" }
          git restore package.json package-lock.json
          $diag = @(
            "# Svelte Diagnostic Bootstrap",
            "",
            "- Source commit: $env:GITHUB_SHA",
            "- resolve: ${{ steps.resolve.outcome }}",
            "- npm ci: ${{ steps.npm_ci.outcome }}",
            "- TS6 svelte-check: ${{ steps.ts6.outcome }}",
            "- TS7 tsgo svelte-check: ${{ steps.ts7.outcome }}",
            "- build: ${{ steps.build.outcome }}",
            "- tracked-data guard: ${{ steps.tracked.outcome }}",
            "",
            "## Resolve",
            "````text",
            $resolve,
            "````",
            "",
            "## TS6 svelte-check",
            "````text",
            $ts6,
            "````",
            "",
            "## TS7 tsgo svelte-check",
            "````text",
            $ts7,
            "````",
            "",
            "## Build",
            "````text",
            $build,
            "````"
          )
          $diag | Set-Content docs/SVELTE_DIAGNOSTICS.md -Encoding utf8
          git add docs/SVELTE_DIAGNOSTICS.md
          git commit -m "ci: record Svelte diagnostic bootstrap"
          git push origin HEAD:main

name: Record Windows Validation Baseline

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/validate-baseline.yml

permissions:
  contents: write

concurrency:
  group: record-windows-validation-baseline
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Reject tracked local/private runtime data
        id: tracked
        continue-on-error: true
        run: npm run validate:repo

      - name: Install locked frontend dependencies
        id: npm_ci
        continue-on-error: true
        run: npm ci --no-audit --no-fund

      - name: Build Svelte and PixiJS frontend
        id: frontend
        continue-on-error: true
        run: npm run build

      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Verify Cargo lockfile
        id: cargo_lock
        continue-on-error: true
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 > NUL

      - name: Check Rust formatting
        id: fmt
        continue-on-error: true
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        id: clippy
        continue-on-error: true
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        id: tests
        continue-on-error: true
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Write validation evidence
        shell: pwsh
        run: |
          $node = node --version
          $npm = npm --version
          $rustc = rustc --version
          $cargo = cargo --version
          $timestamp = (Get-Date).ToUniversalTime().ToString("o")
          $report = @"
          # Windows Validation Baseline

          Machine-generated on a clean GitHub-hosted `windows-latest` runner. The one-time workflow that produced this file removes itself in the same commit.

          - Source commit: `${{ github.sha }}`
          - Recorded at (UTC): `$timestamp`
          - Node.js: `$node`
          - npm: `$npm`
          - rustc: `$rustc`
          - cargo: `$cargo`

          | Check | Outcome |
          |---|---|
          | tracked local/private data guard | `${{ steps.tracked.outcome }}` |
          | `npm ci` from committed `package-lock.json` | `${{ steps.npm_ci.outcome }}` |
          | Svelte / PixiJS production build | `${{ steps.frontend.outcome }}` |
          | `cargo metadata --locked` | `${{ steps.cargo_lock.outcome }}` |
          | `cargo fmt --check` | `${{ steps.fmt.outcome }}` |
          | `cargo clippy --locked --all-targets -- -D warnings` | `${{ steps.clippy.outcome }}` |
          | `cargo test --locked` | `${{ steps.tests.outcome }}` |

          This is source-validation evidence only. NSIS execution/bundle verification and Ryzen 3 2200G target-machine performance remain separate acceptance gates.
          "@
          Set-Content -Path docs/VALIDATION_BASELINE.md -Value $report -Encoding utf8

      - name: Commit evidence and remove one-time workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/VALIDATION_BASELINE.md
          git rm .github/workflows/validate-baseline.yml
          git commit -m "ci: record Windows validation evidence"
          git push origin HEAD:main

      - name: Fail run if validation failed
        shell: pwsh
        run: |
          $outcomes = @(
            "${{ steps.tracked.outcome }}",
            "${{ steps.npm_ci.outcome }}",
            "${{ steps.frontend.outcome }}",
            "${{ steps.cargo_lock.outcome }}",
            "${{ steps.fmt.outcome }}",
            "${{ steps.clippy.outcome }}",
            "${{ steps.tests.outcome }}"
          )
          $failed = @($outcomes | Where-Object { $_ -ne "success" })
          if ($failed.Count -gt 0) {
            Write-Error "One or more validation checks failed: $($failed -join ', ')"
            exit 1
          }

name: Fix Rust Quality Gate

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-rust-quality.yml

permissions:
  contents: write

concurrency:
  group: fix-rust-quality-gate
  cancel-in-progress: true

jobs:
  fix-and-validate:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply reviewed Rust rewrites
        id: patch
        continue-on-error: true
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          def load(path):
              return Path(path).read_text(encoding="utf-8")

          def save(path, text):
              Path(path).write_text(text, encoding="utf-8", newline="\n")

          def literal(path, old, new, expected=1):
              text = load(path)
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f"{path}: expected {expected} literal matches, found {count}: {old!r}")
              save(path, text.replace(old, new))

          # bootstrap.rs: equivalent let-chain rewrites requested by Clippy.
          literal(
              "src-tauri/src/bootstrap.rs",
              '''    if let Some(data_dir) = &local_data_dir {
                  if let Err(error) = privacy_policy_service.install(data_dir.join("privacy-rules.json")) {
                      eprintln!(
                          "Lenvu privacy rules unavailable; active-window identity remains blocked: {error}"
                      );
                  }
              }
          ''',
              '''    if let Some(data_dir) = &local_data_dir
                  && let Err(error) = privacy_policy_service.install(data_dir.join("privacy-rules.json"))
              {
                  eprintln!(
                      "Lenvu privacy rules unavailable; active-window identity remains blocked: {error}"
                  );
              }
          ''',
          )
          literal(
              "src-tauri/src/bootstrap.rs",
              '''                if !persistence.had_saved_state() {
                              if let Err(error) = persistence.queue_save(initial_state) {
                                  eprintln!("Lenvu initial persistence save failed: {error}");
                              }
                          }
          ''',
              '''                if !persistence.had_saved_state()
                              && let Err(error) = persistence.queue_save(initial_state)
                          {
                              eprintln!("Lenvu initial persistence save failed: {error}");
                          }
          ''',
          )

          # commands.rs: Windows cfg blocks already define the function result expression.
          literal(
              "src-tauri/src/commands.rs",
              '''        return Ok(StartupStatus {
                      supported: true,
                      enabled,
                  });
          ''',
              '''        Ok(StartupStatus {
                      supported: true,
                      enabled,
                  })
          ''',
          )
          literal(
              "src-tauri/src/commands.rs",
              '''        return Ok(StartupStatus {
                      supported: true,
                      enabled: actual,
                  });
          ''',
              '''        Ok(StartupStatus {
                      supported: true,
                      enabled: actual,
                  })
          ''',
          )

          # Object attention is a deliberate domain contract ahead of its future producer.
          literal(
              "src-tauri/src/domain/pet_state.rs",
              '''    Window,
              Object,
          ''',
              '''    Window,
              // Reserved for future object-level structured attention; current producers stop at window/cursor.
              #[allow(dead_code)]
              Object,
          ''',
          )

          # Future Memory Evaluator transport exists intentionally but has no producer yet.
          literal(
              "src-tauri/src/persistence.rs",
              '''    StoreMemory(MemoryDraft),
              SearchMemories {
          ''',
              '''    #[allow(dead_code)]
              StoreMemory(MemoryDraft),
              #[allow(dead_code)]
              SearchMemories {
          ''',
          )
          literal(
              "src-tauri/src/persistence.rs",
              '''    pub fn queue_memory(&self, memory: MemoryDraft) -> Result<(), String> {
          ''',
              '''    #[allow(dead_code)]
              pub fn queue_memory(&self, memory: MemoryDraft) -> Result<(), String> {
          ''',
              expected=2,
          )
          literal(
              "src-tauri/src/persistence.rs",
              '''    pub fn search_memories(
          ''',
              '''    #[allow(dead_code)]
              pub fn search_memories(
          ''',
              expected=2,
          )

          # This privacy convenience method is currently only asserted by privacy tests.
          literal(
              "src-tauri/src/privacy.rs",
              '''    pub fn is_accessibility_context_allowed(&self, app_id: &str) -> bool {
          ''',
              '''    #[cfg(test)]
              pub fn is_accessibility_context_allowed(&self, app_id: &str) -> bool {
          ''',
          )

          # Detached runtime constructors are retained only for focused unit tests.
          literal(
              "src-tauri/src/runtime.rs",
              '''    thread,
              time::{Duration, Instant},
          ''',
              '''    time::{Duration, Instant},
          ''',
          )
          literal(
              "src-tauri/src/runtime.rs",
              '''};

          use serde::Serialize;
          ''',
              '''};

          #[cfg(test)]
          use std::thread;

          use serde::Serialize;
          ''',
          )
          literal(
              "src-tauri/src/runtime.rs",
              '''    pub fn spawn(tick_interval: Duration) -> Self {
          ''',
              '''    #[cfg(test)]
              pub fn spawn(tick_interval: Duration) -> Self {
          ''',
          )
          literal(
              "src-tauri/src/runtime.rs",
              '''    pub fn spawn_with_state(tick_interval: Duration, initial_state: PetStateV2) -> Self {
          ''',
              '''    #[cfg(test)]
              pub fn spawn_with_state(tick_interval: Duration, initial_state: PetStateV2) -> Self {
          ''',
          )
          literal(
              "src-tauri/src/runtime.rs",
              '''    pub fn spawn_with_state_and_observer(
          ''',
              '''    #[cfg(test)]
              pub fn spawn_with_state_and_observer(
          ''',
          )

          # Whole-supervisor shutdown is test-only; production uses ordered phase barriers.
          literal(
              "src-tauri/src/worker.rs",
              '''    fn cancel_all(&self) {
          ''',
              '''    #[cfg(test)]
              fn cancel_all(&self) {
          ''',
          )
          literal(
              "src-tauri/src/worker.rs",
              '''    pub fn shutdown_and_join(&self, timeout: Duration) -> ShutdownReport {
          ''',
              '''    #[cfg(test)]
              pub fn shutdown_and_join(&self, timeout: Duration) -> ShutdownReport {
          ''',
          )

          # Prefer explicit state construction over mutate-after-default.
          literal(
              "src-tauri/src/persistence.rs",
              '''    fn into_runtime_state(self) -> PetStateV2 {
                  let mut state = PetStateV2::default();
                  state.facing = self.facing;
                  state.energy = self.energy.clamp(0.0, 1.0);
                  state.curiosity = self.curiosity.clamp(0.0, 1.0);
                  state.bond = self.bond.clamp(0.0, 1.0);
                  state.sleep_pressure = self.sleep_pressure.clamp(0.0, 1.0);
                  state
              }
          ''',
              '''    fn into_runtime_state(self) -> PetStateV2 {
                  PetStateV2 {
                      facing: self.facing,
                      energy: self.energy.clamp(0.0, 1.0),
                      curiosity: self.curiosity.clamp(0.0, 1.0),
                      bond: self.bond.clamp(0.0, 1.0),
                      sleep_pressure: self.sleep_pressure.clamp(0.0, 1.0),
                      ..PetStateV2::default()
                  }
              }
          ''',
          )
          literal(
              "src-tauri/src/persistence.rs",
              '''            if counts_as_interaction {
                          if let Some(hour) = current_hour {
                              persistence.observe_hour(hour, 1)?;
                          }
                      }
          ''',
              '''            if counts_as_interaction
                          && let Some(hour) = current_hour
                      {
                          persistence.observe_hour(hour, 1)?;
                      }
          ''',
          )
          literal(
              "src-tauri/src/persistence.rs",
              '''        let mut state = PetStateV2::default();
                  state.bond = 0.91;
          ''',
              '''        let state = PetStateV2 {
                      bond: 0.91,
                      ..PetStateV2::default()
                  };
          ''',
          )
          literal(
              "src-tauri/src/domain/pet_v2.rs",
              '''        let mut state = PetStateV2::default();
                  state.bond = 0.77;
                  state.facing = Facing::Left;
          ''',
              '''        let state = PetStateV2 {
                      bond: 0.77,
                      facing: Facing::Left,
                      ..PetStateV2::default()
                  };
          ''',
          )
          literal(
              "src-tauri/src/runtime.rs",
              '''        let mut state = PetStateV2::default();
                  state.bond = 0.66;
                  state.facing = Facing::Left;
          ''',
              '''        let state = PetStateV2 {
                      bond: 0.66,
                      facing: Facing::Left,
                      ..PetStateV2::default()
                  };
          ''',
          )

          # Preserve ordered shutdown semantics while using the let-chain form Clippy requests.
          literal(
              "src-tauri/src/lib.rs",
              '''        if let Some(runtime) = app_handle.try_state::<RuntimeHandle>() {
                      if let Err(error) = runtime.close_event_input() {
                          eprintln!("Lenvu runtime input gate could not close cleanly: {error}");
                      }
                  }
          ''',
              '''        if let Some(runtime) = app_handle.try_state::<RuntimeHandle>()
                      && let Err(error) = runtime.close_event_input()
                  {
                      eprintln!("Lenvu runtime input gate could not close cleanly: {error}");
                  }
          ''',
          )
          literal(
              "src-tauri/src/lib.rs",
              '''        if let (Some(snapshot), Some(persistence)) = (
                      frozen_snapshot,
                      app_handle.try_state::<PersistenceService>(),
                  ) {
                      if let Err(error) = persistence.save_and_flush(
                          snapshot.state,
                          bootstrap::PERSISTENCE_FINAL_SAVE_TIMEOUT,
                      ) {
                          eprintln!("Lenvu final persistence save failed: {error}");
                      }
                  }
          ''',
              '''        if let (Some(snapshot), Some(persistence)) = (
                      frozen_snapshot,
                      app_handle.try_state::<PersistenceService>(),
                  ) && let Err(error) = persistence.save_and_flush(
                      snapshot.state,
                      bootstrap::PERSISTENCE_FINAL_SAVE_TIMEOUT,
                  ) {
                      eprintln!("Lenvu final persistence save failed: {error}");
                  }
          ''',
          )
          '@ | Set-Content repair.py -Encoding utf8
          python repair.py 2>&1 | Tee-Object repair.log
          $code = $LASTEXITCODE
          Remove-Item repair.py
          exit $code

      - name: Format Rust
        id: fmt
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all 2>&1 | Tee-Object fmt.log
          exit $LASTEXITCODE

      - name: Verify Rust formatting
        id: fmt_check
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check 2>&1 | Tee-Object fmt_check.log
          exit $LASTEXITCODE

      - name: Verify Clippy
        id: clippy
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings 2>&1 | Tee-Object clippy.log
          exit $LASTEXITCODE

      - name: Test Rust
        id: tests
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | Tee-Object tests.log
          exit $LASTEXITCODE

      - name: Install locked frontend dependencies
        id: npm_ci
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        id: frontend
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Reject tracked local/private runtime data
        id: tracked
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: npm run validate:repo

      - name: Publish repair result
        if: always()
        shell: pwsh
        run: |
          $success = "${{ steps.patch.outcome }}" -eq "success" -and
                     "${{ steps.fmt.outcome }}" -eq "success" -and
                     "${{ steps.fmt_check.outcome }}" -eq "success" -and
                     "${{ steps.clippy.outcome }}" -eq "success" -and
                     "${{ steps.tests.outcome }}" -eq "success" -and
                     "${{ steps.npm_ci.outcome }}" -eq "success" -and
                     "${{ steps.frontend.outcome }}" -eq "success" -and
                     "${{ steps.tracked.outcome }}" -eq "success"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ($success) {
            $timestamp = (Get-Date).ToUniversalTime().ToString("o")
            $node = (node --version | Out-String).Trim()
            $npm = (npm --version | Out-String).Trim()
            $rustc = (rustc --version | Out-String).Trim()
            $cargo = (cargo --version | Out-String).Trim()
            $report = @"
          # Windows Validation Baseline

          Machine-generated on a clean GitHub-hosted windows-latest runner after the Rust quality-gate repair.

          - Validated working-tree parent: $env:GITHUB_SHA
          - Recorded at (UTC): $timestamp
          - Node.js: $node
          - npm: $npm
          - rustc: $rustc
          - cargo: $cargo

          | Check | Outcome |
          |---|---|
          | tracked local/private data guard | success |
          | npm ci from committed package-lock.json | success |
          | Svelte / PixiJS production build | success |
          | cargo fmt --check | success |
          | cargo clippy --locked --all-targets -- -D warnings | success |
          | cargo test --locked | success |

          This is source-validation evidence only. NSIS execution/bundle verification and Ryzen 3 2200G target-machine performance remain separate acceptance gates.
          "@
            Set-Content docs/VALIDATION_BASELINE.md -Value $report -Encoding utf8
            if (Test-Path docs/CI_DIAGNOSTICS.md) { git rm docs/CI_DIAGNOSTICS.md }
            if (Test-Path docs/RUST_QUALITY_REPAIR.md) { git rm docs/RUST_QUALITY_REPAIR.md }
            git add src-tauri docs/VALIDATION_BASELINE.md
            git commit -m "fix: close Rust Windows quality gate"
            git push origin HEAD:main
            exit 0
          }

          git restore src-tauri
          $repair = if (Test-Path repair.log) { (Get-Content repair.log -Tail 160) -join "`n" } else { "not run or no output" }
          $fmt = if (Test-Path fmt_check.log) { (Get-Content fmt_check.log -Tail 120) -join "`n" } else { "not run or no output" }
          $clippy = if (Test-Path clippy.log) { (Get-Content clippy.log -Tail 220) -join "`n" } else { "not run or no output" }
          $tests = if (Test-Path tests.log) { (Get-Content tests.log -Tail 120) -join "`n" } else { "not run or no output" }
          $timestamp = (Get-Date).ToUniversalTime().ToString("o")
          $failure = @"
          # Rust Quality Repair Diagnostics

          - Source commit: $env:GITHUB_SHA
          - Recorded at (UTC): $timestamp
          - patch: ${{ steps.patch.outcome }}
          - rustfmt: ${{ steps.fmt.outcome }}
          - rustfmt check: ${{ steps.fmt_check.outcome }}
          - Clippy: ${{ steps.clippy.outcome }}
          - tests: ${{ steps.tests.outcome }}
          - npm ci: ${{ steps.npm_ci.outcome }}
          - frontend build: ${{ steps.frontend.outcome }}
          - tracked-data guard: ${{ steps.tracked.outcome }}

          ## Repair step
          ````text
          $repair
          ````

          ## rustfmt check
          ````text
          $fmt
          ````

          ## Clippy
          ````text
          $clippy
          ````

          ## Tests
          ````text
          $tests
          ````
          "@
          Set-Content docs/RUST_QUALITY_REPAIR.md -Value $failure -Encoding utf8
          git add docs/RUST_QUALITY_REPAIR.md
          git commit -m "ci: record Rust repair diagnostics"
          git push origin HEAD:main

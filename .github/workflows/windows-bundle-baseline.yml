name: Validate Windows Bundle Baseline

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/windows-bundle-baseline.yml

permissions:
  contents: write

concurrency:
  group: windows-bundle-baseline
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked frontend dependencies
        id: npm_ci
        continue-on-error: true
        run: npm ci --no-audit --no-fund

      - name: Verify frontend source gates
        id: frontend
        if: steps.npm_ci.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          npm run check:svelte 2>&1 | Tee-Object frontend.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check:svelte:tsgo 2>&1 | Tee-Object -Append frontend.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run validate:repo 2>&1 | Tee-Object -Append frontend.log
          exit $LASTEXITCODE

      - name: Install stable Rust
        id: rust
        continue-on-error: true
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Verify locked Cargo graph
        id: cargo_lock
        if: steps.rust.outcome == 'success'
        continue-on-error: true
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 > NUL

      - name: Build release executable and NSIS
        id: build
        if: steps.npm_ci.outcome == 'success' && steps.frontend.outcome == 'success' && steps.cargo_lock.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          npm run desktop:build -- --bundles nsis 2>&1 | Tee-Object bundle.log
          exit $LASTEXITCODE

      - name: Smoke launch release executable
        id: launch
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $app = Get-ChildItem src-tauri/target/release -Filter northpalace-my-pet.exe -File | Select-Object -First 1
          if (-not $app) { throw "release executable not found" }
          $process = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "release executable exited during 8-second smoke window with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
          Wait-Process -Id $process.Id -ErrorAction SilentlyContinue

      - name: Inspect bundle artifacts
        id: inspect
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $app = Get-ChildItem src-tauri/target/release -Filter northpalace-my-pet.exe -File | Select-Object -First 1
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *.exe -File | Select-Object -First 1
          if (-not $app) { throw "release executable not found" }
          if (-not $installer) { throw "NSIS installer not found" }
          "APP_PATH=$($app.FullName)" >> $env:GITHUB_ENV
          "APP_NAME=$($app.Name)" >> $env:GITHUB_ENV
          "APP_BYTES=$($app.Length)" >> $env:GITHUB_ENV
          "APP_SHA256=$((Get-FileHash $app.FullName -Algorithm SHA256).Hash)" >> $env:GITHUB_ENV
          "INSTALLER_PATH=$($installer.FullName)" >> $env:GITHUB_ENV
          "INSTALLER_NAME=$($installer.Name)" >> $env:GITHUB_ENV
          "INSTALLER_BYTES=$($installer.Length)" >> $env:GITHUB_ENV
          "INSTALLER_SHA256=$((Get-FileHash $installer.FullName -Algorithm SHA256).Hash)" >> $env:GITHUB_ENV

      - name: Upload clean Windows bundle
        if: steps.build.outcome == 'success' && steps.inspect.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: northpalace-clean-windows-bundle-${{ github.sha }}
          path: |
            src-tauri/target/release/northpalace-my-pet.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Publish bundle evidence
        if: always()
        shell: pwsh
        run: |
          $ok = (
            "${{ steps.npm_ci.outcome }}" -eq "success" -and
            "${{ steps.frontend.outcome }}" -eq "success" -and
            "${{ steps.rust.outcome }}" -eq "success" -and
            "${{ steps.cargo_lock.outcome }}" -eq "success" -and
            "${{ steps.build.outcome }}" -eq "success" -and
            "${{ steps.launch.outcome }}" -eq "success" -and
            "${{ steps.inspect.outcome }}" -eq "success"
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ($ok) {
            $timestamp = (Get-Date).ToUniversalTime().ToString("o")
            $report = @(
              "# Windows Bundle Baseline",
              "",
              "Machine-generated on a clean GitHub-hosted windows-latest runner.",
              "",
              "- Validated source commit: $env:GITHUB_SHA",
              "- Recorded at (UTC): $timestamp",
              "- Node.js: $((node --version | Out-String).Trim())",
              "- npm: $((npm --version | Out-String).Trim())",
              "- rustc: $((rustc --version | Out-String).Trim())",
              "- cargo: $((cargo --version | Out-String).Trim())",
              "",
              "| Check | Outcome |",
              "|---|---|",
              "| npm ci | success |",
              "| Svelte TS6 + TS7 zero-warning gates | success |",
              "| tracked-data guard | success |",
              "| cargo metadata --locked | success |",
              "| Tauri release + NSIS build | success |",
              "| release executable 8-second smoke launch | success |",
              "| bundle artifact discovery | success |",
              "",
              "## Artifacts",
              "",
              "- App: $env:APP_NAME",
              "- App bytes: $env:APP_BYTES",
              "- App SHA-256: $env:APP_SHA256",
              "- NSIS: $env:INSTALLER_NAME",
              "- NSIS bytes: $env:INSTALLER_BYTES",
              "- NSIS SHA-256: $env:INSTALLER_SHA256",
              "",
              "This validates clean Windows buildability and a bounded launch smoke test on GitHub-hosted Windows. It does not replace Ryzen 3 2200G target-machine behavior/performance validation."
            )
            $report | Set-Content docs/WINDOWS_BUNDLE_BASELINE.md -Encoding utf8
            if (Test-Path docs/WINDOWS_BUNDLE_DIAGNOSTICS.md) { git rm docs/WINDOWS_BUNDLE_DIAGNOSTICS.md }
            git add docs/WINDOWS_BUNDLE_BASELINE.md
            git commit -m "ci: record clean Windows bundle baseline"
            git push origin HEAD:main
            exit 0
          }

          $bundle = if (Test-Path bundle.log) { (Get-Content bundle.log -Tail 240) -join "`n" } else { "not run" }
          $diag = @(
            "# Windows Bundle Diagnostics",
            "",
            "- Source commit: $env:GITHUB_SHA",
            "- npm ci: ${{ steps.npm_ci.outcome }}",
            "- frontend gates: ${{ steps.frontend.outcome }}",
            "- Rust setup: ${{ steps.rust.outcome }}",
            "- Cargo lock: ${{ steps.cargo_lock.outcome }}",
            "- bundle build: ${{ steps.build.outcome }}",
            "- smoke launch: ${{ steps.launch.outcome }}",
            "- artifact inspection: ${{ steps.inspect.outcome }}",
            "",
            "## Bundle log",
            "````text",
            $bundle,
            "````"
          )
          $diag | Set-Content docs/WINDOWS_BUNDLE_DIAGNOSTICS.md -Encoding utf8
          git add docs/WINDOWS_BUNDLE_DIAGNOSTICS.md
          git commit -m "ci: record Windows bundle diagnostics"
          git push origin HEAD:main

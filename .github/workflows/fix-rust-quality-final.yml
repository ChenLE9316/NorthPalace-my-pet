name: Final Rust Quality Repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-rust-quality-final.yml

permissions:
  contents: write

concurrency:
  group: fix-rust-quality-gate
  cancel-in-progress: true

jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Apply reviewed repair
        id: patch
        continue-on-error: true
        shell: pwsh
        run: |
          python scripts/repair-rust-quality.py 2>&1 | Tee-Object repair.log
          exit $LASTEXITCODE

      - name: Format Rust
        id: fmt
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all 2>&1 | Tee-Object fmt.log
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check 2>&1 | Tee-Object -Append fmt.log
          exit $LASTEXITCODE

      - name: Verify Clippy
        id: clippy
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings 2>&1 | Tee-Object clippy.log
          exit $LASTEXITCODE

      - name: Test Rust
        id: tests
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | Tee-Object tests.log
          exit $LASTEXITCODE

      - name: Verify frontend and repo guard
        id: frontend
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run validate:repo
          exit $LASTEXITCODE

      - name: Publish result
        if: always()
        shell: pwsh
        run: |
          $ok = (
            "${{ steps.patch.outcome }}" -eq "success" -and
            "${{ steps.fmt.outcome }}" -eq "success" -and
            "${{ steps.clippy.outcome }}" -eq "success" -and
            "${{ steps.tests.outcome }}" -eq "success" -and
            "${{ steps.frontend.outcome }}" -eq "success"
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ($ok) {
            $timestamp = (Get-Date).ToUniversalTime().ToString("o")
            $report = @(
              "# Windows Validation Baseline",
              "",
              "Machine-generated on a clean GitHub-hosted windows-latest runner after the Rust quality-gate repair.",
              "",
              "- Validated working-tree parent: $env:GITHUB_SHA",
              "- Recorded at (UTC): $timestamp",
              "- Node.js: $((node --version | Out-String).Trim())",
              "- npm: $((npm --version | Out-String).Trim())",
              "- rustc: $((rustc --version | Out-String).Trim())",
              "- cargo: $((cargo --version | Out-String).Trim())",
              "",
              "| Check | Outcome |",
              "|---|---|",
              "| tracked local/private data guard | success |",
              "| npm ci from committed package-lock.json | success |",
              "| Svelte / PixiJS production build | success |",
              "| cargo fmt --check | success |",
              "| cargo clippy --locked --all-targets -- -D warnings | success |",
              "| cargo test --locked | success |",
              "",
              "NSIS bundle execution and Ryzen 3 2200G target-machine performance remain separate acceptance gates."
            )
            $report | Set-Content docs/VALIDATION_BASELINE.md -Encoding utf8
            if (Test-Path docs/CI_DIAGNOSTICS.md) { git rm docs/CI_DIAGNOSTICS.md }
            if (Test-Path docs/RUST_QUALITY_REPAIR.md) { git rm docs/RUST_QUALITY_REPAIR.md }
            git add src-tauri docs/VALIDATION_BASELINE.md
            git commit -m "fix: close Rust Windows quality gate"
            git push origin HEAD:main
            exit 0
          }

          git restore src-tauri
          $clippy = if (Test-Path clippy.log) { (Get-Content clippy.log -Tail 180) -join "`n" } else { "not run" }
          $tests = if (Test-Path tests.log) { (Get-Content tests.log -Tail 80) -join "`n" } else { "not run" }
          $diag = @(
            "# Rust Quality Repair Diagnostics",
            "",
            "- Source commit: $env:GITHUB_SHA",
            "- patch: ${{ steps.patch.outcome }}",
            "- fmt: ${{ steps.fmt.outcome }}",
            "- Clippy: ${{ steps.clippy.outcome }}",
            "- tests: ${{ steps.tests.outcome }}",
            "- frontend/repo: ${{ steps.frontend.outcome }}",
            "",
            "## Clippy",
            "````text",
            $clippy,
            "````",
            "",
            "## Tests",
            "````text",
            $tests,
            "````"
          )
          $diag | Set-Content docs/RUST_QUALITY_REPAIR.md -Encoding utf8
          git add docs/RUST_QUALITY_REPAIR.md
          git commit -m "ci: record final Rust repair diagnostics"
          git push origin HEAD:main

name: Fix Rust Quality Gate V2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-rust-quality-v2.yml

permissions:
  contents: write

concurrency:
  group: fix-rust-quality-gate
  cancel-in-progress: true

jobs:
  fix-and-validate:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Apply reviewed Rust repair
        id: patch
        continue-on-error: true
        shell: pwsh
        run: |
          python scripts/repair-rust-quality.py 2>&1 | Tee-Object repair.log
          exit $LASTEXITCODE

      - name: Format Rust
        id: fmt
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all 2>&1 | Tee-Object fmt.log
          exit $LASTEXITCODE

      - name: Verify Rust formatting
        id: fmt_check
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check 2>&1 | Tee-Object fmt_check.log
          exit $LASTEXITCODE

      - name: Verify locked Cargo graph
        id: cargo_lock
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 > NUL

      - name: Verify Clippy
        id: clippy
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings 2>&1 | Tee-Object clippy.log
          exit $LASTEXITCODE

      - name: Test Rust
        id: tests
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | Tee-Object tests.log
          exit $LASTEXITCODE

      - name: Install locked frontend dependencies
        id: npm_ci
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        id: frontend
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Reject tracked local/private runtime data
        id: tracked
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: npm run validate:repo

      - name: Publish repair result
        if: always()
        shell: pwsh
        run: |
          $success = (
            "${{ steps.patch.outcome }}" -eq "success" -and
            "${{ steps.fmt.outcome }}" -eq "success" -and
            "${{ steps.fmt_check.outcome }}" -eq "success" -and
            "${{ steps.cargo_lock.outcome }}" -eq "success" -and
            "${{ steps.clippy.outcome }}" -eq "success" -and
            "${{ steps.tests.outcome }}" -eq "success" -and
            "${{ steps.npm_ci.outcome }}" -eq "success" -and
            "${{ steps.frontend.outcome }}" -eq "success" -and
            "${{ steps.tracked.outcome }}" -eq "success"
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ($success) {
            $timestamp = (Get-Date).ToUniversalTime().ToString("o")
            $node = (node --version | Out-String).Trim()
            $npm = (npm --version | Out-String).Trim()
            $rustc = (rustc --version | Out-String).Trim()
            $cargo = (cargo --version | Out-String).Trim()
            $report = @(
              "# Windows Validation Baseline",
              "",
              "Machine-generated on a clean GitHub-hosted windows-latest runner after the Rust quality-gate repair.",
              "",
              "- Validated working-tree parent: $env:GITHUB_SHA",
              "- Recorded at (UTC): $timestamp",
              "- Node.js: $node",
              "- npm: $npm",
              "- rustc: $rustc",
              "- cargo: $cargo",
              "",
              "| Check | Outcome |",
              "|---|---|",
              "| tracked local/private data guard | success |",
              "| npm ci from committed package-lock.json | success |",
              "| Svelte / PixiJS production build | success |",
              "| cargo metadata --locked | success |",
              "| cargo fmt --check | success |",
              "| cargo clippy --locked --all-targets -- -D warnings | success |",
              "| cargo test --locked | success |",
              "",
              "This is source-validation evidence only. NSIS execution/bundle verification and Ryzen 3 2200G target-machine performance remain separate acceptance gates."
            )
            $report | Set-Content docs/VALIDATION_BASELINE.md -Encoding utf8
            if (Test-Path docs/CI_DIAGNOSTICS.md) { git rm docs/CI_DIAGNOSTICS.md }
            if (Test-Path docs/RUST_QUALITY_REPAIR.md) { git rm docs/RUST_QUALITY_REPAIR.md }
            git add src-tauri docs/VALIDATION_BASELINE.md
            git commit -m "fix: close Rust Windows quality gate"
            git push origin HEAD:main
            exit 0
          }

          git restore src-tauri
          $repair = if (Test-Path repair.log) { (Get-Content repair.log -Tail 160) -join "`n" } else { "not run or no output" }
          $fmt = if (Test-Path fmt_check.log) { (Get-Content fmt_check.log -Tail 120) -join "`n" } else { "not run or no output" }
          $clippy = if (Test-Path clippy.log) { (Get-Content clippy.log -Tail 220) -join "`n" } else { "not run or no output" }
          $tests = if (Test-Path tests.log) { (Get-Content tests.log -Tail 120) -join "`n" } else { "not run or no output" }
          $timestamp = (Get-Date).ToUniversalTime().ToString("o")
          $failure = @(
            "# Rust Quality Repair Diagnostics",
            "",
            "- Source commit: $env:GITHUB_SHA",
            "- Recorded at (UTC): $timestamp",
            "- patch: ${{ steps.patch.outcome }}",
            "- rustfmt: ${{ steps.fmt.outcome }}",
            "- rustfmt check: ${{ steps.fmt_check.outcome }}",
            "- cargo lock: ${{ steps.cargo_lock.outcome }}",
            "- Clippy: ${{ steps.clippy.outcome }}",
            "- tests: ${{ steps.tests.outcome }}",
            "- npm ci: ${{ steps.npm_ci.outcome }}",
            "- frontend build: ${{ steps.frontend.outcome }}",
            "- tracked-data guard: ${{ steps.tracked.outcome }}",
            "",
            "## Repair step",
            "````text",
            $repair,
            "````",
            "",
            "## rustfmt check",
            "````text",
            $fmt,
            "````",
            "",
            "## Clippy",
            "````text",
            $clippy,
            "````",
            "",
            "## Tests",
            "````text",
            $tests,
            "````"
          )
          $failure | Set-Content docs/RUST_QUALITY_REPAIR.md -Encoding utf8
          git add docs/RUST_QUALITY_REPAIR.md
          git commit -m "ci: record Rust repair diagnostics v2"
          git push origin HEAD:main

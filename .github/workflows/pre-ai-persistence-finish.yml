name: Pre-AI Persistence Finish

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-pre-ai-finish.py
      - .github/workflows/pre-ai-persistence-finish.yml

permissions:
  contents: write

concurrency:
  group: pre-ai-persistence-finish
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Apply bounded persistence finish patch
        run: python scripts/apply-pre-ai-finish.py

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Verify tracked-data guard
        run: npm run validate:repo

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Check Svelte TypeScript 6
        run: npm run check:svelte

      - name: Check Svelte TypeScript 7 tsgo
        run: npm run check:svelte:tsgo

      - name: Build frontend and asset contract
        run: npm run build

      - name: Verify locked Cargo graph
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 > NUL

      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Commit validated persistence finish
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src
          if (git diff --cached --quiet) { throw "finish patch produced no source changes" }
          git commit -m "feat: add rule-based memory evaluator and local backup"
          git push origin HEAD:main

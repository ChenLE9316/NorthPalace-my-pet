name: Expose Lenvu Source Preview

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/visual-source-preview.yml

permissions:
  contents: write

concurrency:
  group: lenvu-source-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Create tiny inspection-only JPEG base64 preview
        shell: pwsh
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund sharp@0.34.4
          @'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import sharp from 'sharp';

          const source = 'assets/reference/anatomy/lenvu-anatomy-reference.webp';
          const image = sharp(source);
          const metadata = await image.metadata();
          const jpeg = await image
            .resize({ width: 192, withoutEnlargement: true })
            .jpeg({ quality: 84, chromaSubsampling: '4:4:4' })
            .toBuffer();
          const base64 = jpeg.toString('base64').match(/.{1,76}/g)?.join('\n') ?? '';
          const header = [
            `source=${source}`,
            `sourceWidth=${metadata.width}`,
            `sourceHeight=${metadata.height}`,
            `previewFormat=jpeg`,
            `previewWidth=192`,
            `previewSha256=${crypto.createHash('sha256').update(jpeg).digest('hex')}`,
            '---BASE64---',
          ].join('\n');
          fs.writeFileSync('docs/LENVU_SOURCE_TINY.b64', `${header}\n${base64}\n`, 'utf8');
          '@ | Set-Content make-preview.mjs -Encoding utf8
          node make-preview.mjs
          Remove-Item make-preview.mjs

      - name: Commit temporary tiny preview bridge
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LENVU_SOURCE_TINY.b64
          git commit -m "chore: stage tiny Lenvu source preview"
          git push origin HEAD:main

    <text class="meta" x="18" y="52">source region: x30 y525 w315 h485</text>
    <svg x="18" y="68" width="314" height="244" viewBox="30 525 315 485" preserveAspectRatio="xMidYMid meet" overflow="hidden">
      <image href="../../../../reference/anatomy/lenvu-anatomy-reference.webp" x="0" y="0" width="1536" height="1024"/>
    </svg>
    <text class="meta" x="18" y="330">R eye cyan · L eye violet · L horn gold accent · centered glyph</text>
  </g>

  <!-- HEAD PROFILE -->
  <g transform="translate(418 714)">
    <rect class="panel" width="350" height="348" rx="12"/>
    <text class="label" x="18" y="30">HEAD / IDENTITY — PROFILE</text>
    <text class="meta" x="18" y="52">source region: x360 y525 w345 h485</text>
    <svg x="18" y="68" width="314" height="244" viewBox="360 525 345 485" preserveAspectRatio="xMidYMid meet" overflow="hidden">

    </svg>
    <text class="meta" x="18" y="330">elongated canine muzzle · tall ears · segmented dark horns</text>
  </g>

  <!-- DETAIL STRIP -->
  <g transform="translate(788 714)">
    <rect class="panel" width="764" height="348" rx="12"/>
    <text class="label" x="18" y="30">DETAIL STRIP — PAWS / LUMEN-CODE / TAIL</text>
    <text class="meta" x="18" y="52">source region: x705 y550 w810 h460</text>
    <svg x="18" y="68" width="728" height="244" viewBox="705 550 810 460" preserveAspectRatio="xMidYMid meet" overflow="hidden">
      <image href="../../../../reference/anatomy/lenvu-anatomy-reference.webp" x="0" y="0" width="1536" height="1024"/>

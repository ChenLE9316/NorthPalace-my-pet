[package]
name = "northpalace-my-pet"
version = "0.1.0"
description = "Lenvu local-first desktop companion"
authors = ["NorthPalace"]
edition = "2024"

[lib]
name = "northpalace_my_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
